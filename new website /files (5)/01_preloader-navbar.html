<!--
=======================================================
  LUXURY STAY — SECTION 1: PRELOADER & NAVBAR
  File: 01_preloader-navbar.html
=======================================================
  TOPIC COVERED:
  • Preloader animation (shown while page loads)
  • Responsive Navigation Bar with:
      - Logo with spinning symbol
      - Nav links with smooth scroll
      - Sign In button (links to login.html)
      - "Book Now" button (triggers booking modal)
      - Hamburger icon for mobile menu
=======================================================
-->

  <!-- ══════════════════════════════════════
        PRELOADER
        Shown before page content loads.
        Controlled via JavaScript in script.js
  ══════════════════════════════════════ -->
  <div id="preloader">
    <div class="preloader-inner">
      <span>L</span><span>U</span><span>X</span><span>U</span><span>R</span><span>Y</span>
      <p>STAY</p>
    </div>
  </div>

  <!-- ══════════════════════════════════════
        NAVBAR
        Fixed top navigation bar.
        Becomes "scrolled" (shrinks) after user
        scrolls 80px — handled via JS scroll event.
  ══════════════════════════════════════ -->
  <nav id="navbar">

    <!-- Brand Logo -->
    <div class="nav-logo">
      <span class="logo-symbol">✦</span>
      <span class="logo-text">Luxury Stay</span>
    </div>

    <!-- Navigation Links -->
    <!-- Each link uses anchor (#section) for smooth scroll -->
    <ul class="nav-links" id="navLinks">
      <li><a href="#home">Home</a></li>
      <li><a href="#about">About</a></li>
      <li><a href="#rooms"     onclick="event.preventDefault();scrollTo('#rooms')">Rooms</a></li>
      <li><a href="#hotels"    onclick="event.preventDefault();scrollTo('#hotels')">Hotels</a></li>
      <li><a href="#amenities">Amenities</a></li>
      <li><a href="#gallery">Gallery</a></li>
      <li><a href="#contact">Contact</a></li>
    </ul>

    <!-- Action Buttons -->
    <div class="nav-actions">
      <a href="login.html" class="login-btn">Sign In</a>
      <button class="book-btn" onclick="openBookingModal()">Book Now</button>
    </div>

    <!-- Mobile Hamburger Menu Icon -->
    <!-- Toggles .open class on navLinks via toggleMenu() in script.js -->
    <div class="hamburger" id="hamburger" onclick="toggleMenu()">
      <span></span><span></span><span></span>
    </div>

  </nav>
